server:
  port: 8083

spring:
  application:
    name: ms-hist-consultas
  datasource:
    url: jdbc:postgresql://localhost:5434/agendeme_historico_db
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ms-historico
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.use.type.headers: false
        spring.json.value.default.type: br.com.agendeme.historico.dto.ConsultaEventDTO
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    path: /graphql

api:
  security:
    token:
      secret: agende-me-secret-key-2026
