version: '3.8'
services:

  db-notificacoes:
    image: postgres:16
    container_name: agende-me-notificacoes-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=agendeme_notificacoes_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
    volumes:
      - pgdata_notificacoes:/var/lib/postgresql/data

volumes:
  pgdata_notificacoes: